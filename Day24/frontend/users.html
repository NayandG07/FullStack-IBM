<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Users | IBM Store</title>
    <link rel="stylesheet" href="style.css">

    <style>
        main {
            width: 92%;
            max-width: 1400px;
            margin: 40px auto;
        }

        .page-title {
            text-align: center;
            margin-bottom: 35px;
        }

        .page-title h2 {
            font-size: 34px;
            margin-bottom: 10px;
        }

        .page-title p {
            color: #666;
        }

        .users-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .user-card {
            background: #fff;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, .07);
            transition: .3s;
        }

        .user-card:hover {
            transform: translateY(-6px);
        }

        .avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin: auto;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f62fe, #0043ce);
            color: #fff;
            font-size: 28px;
            font-weight: bold;
        }

        .user-card h3 {
            text-align: center;
            margin-bottom: 18px;
        }

        .info {
            margin-bottom: 12px;
            color: #555;
            font-size: 15px;
        }

        .info strong {
            color: #222;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 45px;
        }

        .pagination button {
            width: 45px;
            height: 45px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            color: #fff;
            font-weight: bold;
            background: linear-gradient(135deg, #0f62fe, #0043ce);
            transition: .3s;
        }

        .pagination button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(15, 98, 254, .25);
        }

        .pagination button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
    </style>

</head>
<body>

<header>
    <div class="container">
        <div class="logo">
            <a href="index.html">LOGO</a>
        </div>

        <div class="search-box">
            <input type="text" placeholder="Search users...">
        </div>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="#">Products</a></li>
                <li><a href="users.html">Users</a></li>
                <li><a href="#">Cart</a></li>
                <li><a href="login.html">Login / Signup</a></li>
            </ul>
        </nav>
    </div>
</header>

<main>

    <div class="page-title">
        <h2>All Registered Users</h2>
        <p>Manage and explore all registered users.</p>
    </div>

    <div id="usersContainer" class="users-grid"></div>

    <div class="pagination">
        <button id="prevBtn">←</button>
        <button id="pageNumber">1</button>
        <button id="nextBtn">→</button>
    </div>

</main>

<footer>
    <div class="footer-container">

        <div class="footer-column">
            <h3>Company</h3>
            <a href="#">About</a>
            <a href="#">Contact</a>
            <a href="#">Careers</a>
        </div>

        <div class="footer-column">
            <h3>Support</h3>
            <a href="#">Help Center</a>
            <a href="#">Privacy Policy</a>
            <a href="#">Terms</a>
        </div>

        <div class="footer-column">
            <h3>Quick Links</h3>
            <a href="#">Products</a>
            <a href="users.html">Users</a>
            <a href="#">Cart</a>
        </div>

    </div>

    <div class="footer-bottom">
        © 2026 Your Company. All Rights Reserved.
    </div>
</footer>

<script src="config.js"></script>
    <script src="users.js"></script>

</body>
</html>
